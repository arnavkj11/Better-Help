<!DOCTYPE html>
<html>
  <head>
    <title>Schedule Appointment</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #aeb7e9;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 700px;
        margin: auto;
        margin-top: 60px;
        padding: 20px;
        background-color: #fff;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      nav ul {
        list-style: none;
        text-align: left;
        margin-top: 10px;
      }

      nav li {
        display: inline;
        margin: auto;
        margin-right: 10px;
      }

      nav a {
        text-decoration: none;
        color: #ffffff;
        font-weight: bold;
      }
      .cta-button {
        display: inline-block;
        padding: 10px 20px;
        background-color: #007bff;
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-light" style="background-color: #4b4b4b">
        <div class="container-fluid">
          <!--<a class="navbar-brand" href="#">My Therapy</a>-->
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Blog</a></li>
          </ul>
          <div class="text-center">
            <button type="submit" class="btn btn-primary">Log Out</button>
          </div>
        </div>
      </nav>
    </header>

    <div class="container">
        <div>
            <form id="appointment-form" method="post">
                <div class="form-group">
                    <div class="form-group">
                    <label for="usr">Full Name: </label>
                    <input
                      type="text"
                      class="form-control"
                      id="FullName"
                      name="name"
                      value=""
                      placeholder="Enter your Full Name"
                      required
                    />
                  </div><br>
                  <label for="usr">Contact Information</label>
                    <input
                      type="text"
                      class="form-control"
                      id="FullName"
                      name="name"
                      value=""
                      placeholder="Enter your contact information"
                      required
                    />
                  </div><br>
                  <div class="form-group">
                    <label for="usr">Appointment Type: </label>
                    
                  </div><br><br>
                  <div class="text-center">
                    <button class="btn btn-lg btn-primary" type="submit">Schedule an Appointment</button>
                </div>
            </form>
    </div>

    <script src="/static/js/bootstrap.js"></script>
  </body>
</html>
