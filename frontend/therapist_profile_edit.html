<!DOCTYPE html>
<html>
  <head>
    <title>Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #aeb7e9;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 500px;
        margin: auto;
        margin-top: 20px;
        margin-bottom: 20px;
        padding: 20px;
        background-color: #fff;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="text-center">
        <h1>Therapist's Profile</h1>
      </div>
    </br>
      <form>
        <div class="form-label-group">
          <label for="displayName">Name: </label>
            
        </div>
        </br>
        <div class="form-label-group">
          <label for="dateofbirth">Date of Birth: </label>
          <input
            type="date"
            id="dateofbirth"
            class="form-control"
            required
            autofocus>
        </div>
        </br>
        <div class="form-label-group">
            <label for="gender">Gender: </label>
            <select name="gender" id="gender">
                <option value="">Choose Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>
        </br>
        <div class="form-label-group">
            <label for="contactInformation">Contact Information: </label>
            <input  
                type="text"
                id="contactInformation"
                class="form-control"
                placeholder="Enter your contact information"
                required
                autofocus>
        </div>
        </br>
        <div class="form-label-group">
            <label for="license">License/Certification: </label>
            <input  
                type="text"
                id="license"
                class="form-control"
                placeholder="Enter your license/certification"
                required
                autofocus>
        </div>
        </br>
        <div class="form-label-group">
            <label for="specialization">Specialization: </label>
            <input  
                type="text"
                id="specialization"
                class="form-control"
                placeholder="Enter your specialization"
                required
                autofocus>
        </div>
        </br>
        <div class="form-label-group">
            <label for="experience">Experience(in years): </label>
            <input  
                type="number"
                id="experience"
                class="form-control"
                placeholder="Enter your experience"
                required
                autofocus>
        </div>
        </br>
        <div class="form-label-group">
            <label for="bio">Bio/Description: </label>
            <input  
                type="text"
                id="bio"
                class="form-control"
                placeholder="Write your bio/description"
                required
                autofocus>
        </div>
        </br>
        <div class="text-center">
          <button class="btn btn-lg btn-primary" type="submit">Save Profile</button>
        </div>
      </form>
      
    </div>
    <script src="/static/js/bootstrap.js"></script>
  </body>
</html>
