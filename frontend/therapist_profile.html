<!DOCTYPE html>
<html>
  <head>
    <title>Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #aeb7e9;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 500px;
        margin: auto;
        margin-top: 50px;
        margin-bottom: 50px;
        padding: 20px;
        background-color: #fff;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="text-center">
        <h1>Therapist's Profile</h1>
      </div>
    </br>
      <form>
        <div class="form-label-group">
          <label for="displayName">Name: </label>
            
        </div>
        </br>
        <div class="form-label-group">
          <label for="dateofbirth">Date of Birth: </label>
          
        </div>
        </br>
        <div class="form-label-group">
            <label for="gender">Gender: </label>
            
        </div>
        </br>
        <div class="form-label-group">
            <label for="contactInformation">Contact Information: </label>
            
        </div>
        </br>
        <div class="form-label-group">
            <label for="license">License/Certification: </label>
            
        </div>
        </br>
        <div class="form-label-group">
            <label for="specialization">Specialization: </label>
            
        </div>
        </br>
        <div class="form-label-group">
            <label for="experience">Experience(in years): </label>
            
        </div>
        </br>
        <div class="form-label-group">
            <label for="bio">Bio/Description: </label>
            
        </div>
        </br>
        <div class="text-center">
          <button class="btn btn-lg btn-primary" type="submit">Edit Profile</button>
        </div>
      </form>
      
    </div>
    <script src="/static/js/bootstrap.js"></script>
  </body>
</html>
